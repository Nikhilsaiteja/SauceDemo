name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Create .env file from secrets
      run: |
        echo "APP_URL=${{ secrets.APP_URL }}" >> .env
        echo "APP_USERNAME=${{ secrets.APP_USERNAME}}" >> .env
        echo "APP_PASSWORD=${{ secrets.APP_PASSWORD }}" >> .env
        echo "TIMEOUT=${{ secrets.TIMEOUT }}" >> .env
        echo "SHORT_TIMEOUT=${{ secrets.SHORT_TIMEOUT }}" >> .env
        echo "LONG_TIMEOUT=${{ secrets.LONG_TIMEOUT }}" >> .env
        echo "VERY_SHORT_TIMEOUT=${{ secrets.VERY_SHORT_TIMEOUT }}" >> .env
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
